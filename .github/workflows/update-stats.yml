name: Update GitHub Stats SVG

on:
  schedule:
    - cron: '0 * * * *'   # Runs hourly
  workflow_dispatch:      # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Generate stats SVG
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=Maria-Zeb44&show_icons=true&theme=github-dark&hide_border=true&bg_color=0d1117" > stats.svg

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --staged --quiet || git commit -m "Update stats SVG"
          git push
